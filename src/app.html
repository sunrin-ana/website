<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/logo.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
		<!-- HTML Meta Tags -->
		<title>AnA</title>
		<meta name="description" content="새로운 도약과 함께 성장하는 Application & Architecture">

		<!-- Facebook Meta Tags -->
		<meta property="og:url" content="https://ana.st">
		<meta property="og:type" content="website">
		<meta property="og:title" content="AnA">
		<meta property="og:description" content="새로운 도약과 함께 성장하는 Application & Architecture">
		<meta property="og:image" content="https://ana.st/logo.svg">

		<!-- Twitter Meta Tags -->
		<meta name="twitter:card" content="summary_large_image">
		<meta property="twitter:domain" content="ana.st">
		<meta property="twitter:url" content="https://ana.st">
		<meta name="twitter:title" content="AnA">
		<meta name="twitter:description" content="새로운 도약과 함께 성장하는 Application & Architecture">
		<meta name="twitter:image" content="https://ana.st/logo.svg">
		
		%sveltekit.head%
		<style>
			@font-face {
				font-family: 'SFMono-Terminal';
				src: url('/fonts/SFMono-Terminal.woff2') format('woff2'),
				     url('/fonts/SFMono-Terminal.ttf') format('truetype');
				font-weight: 400;
				font-style: normal;
				font-display: swap;
			}

			@font-face {
				font-family: 'RoundedFixedsys';
				src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
				font-weight: normal;
				font-display: swap;
			}

			body {
				padding: 0;
				margin: 0;
				background-color: #f9f9f9;
				font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
				text-rendering: optimizeLegibility;
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
