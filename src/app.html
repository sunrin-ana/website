<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/logo.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" />
		<!-- Page-specific <title>, description and og:url come from <svelte:head>. -->

		<!-- Facebook Meta Tags. og:url is set per page in +layout.svelte. -->
		<meta property="og:type" content="website">
		<meta property="og:title" content="AnA">
		<meta property="og:description" content="새로운 도약과 함께 성장하는 Application & Architecture">
		<meta property="og:image" content="https://ana.st/logo.svg">

		<!-- Twitter Meta Tags -->
		<meta name="twitter:card" content="summary_large_image">
		<meta property="twitter:domain" content="ana.st">
		<meta name="twitter:title" content="AnA">
		<meta name="twitter:description" content="새로운 도약과 함께 성장하는 Application & Architecture">
		<meta name="twitter:image" content="https://ana.st/logo.svg">
		
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#ffffff" />
		<script>
			// Apply the saved theme before first paint so there is no flash.
			// Keep the storage key and event name in sync with src/lib/theme.js.
			(() => {
				const root = document.documentElement;
				const read = () => {
					try {
						return localStorage.getItem('ana-theme');
					} catch {
						return null;
					}
				};
				const paint = (theme) => {
					root.dataset.theme = theme;
					const meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', theme === 'dark' ? '#121318' : '#ffffff');
				};
				const media = matchMedia('(prefers-color-scheme: dark)');
				const saved = read();

				paint(saved === 'light' || saved === 'dark' ? saved : media.matches ? 'dark' : 'light');

				// Until the visitor picks a theme, follow the OS.
				media.addEventListener('change', (event) => {
					const choice = read();
					if (choice === 'light' || choice === 'dark') return;
					paint(event.matches ? 'dark' : 'light');
					window.dispatchEvent(new CustomEvent('ana:themechange'));
				});
			})();
		</script>
		%sveltekit.head%
		<style>
			@font-face {
				font-family: 'SFMono-Terminal';
				src: url('/fonts/SFMono-Terminal.ttf') format('truetype');
				font-weight: 295 900;
				font-style: normal;
				font-display: swap;
			}

			@font-face {
				font-family: 'RoundedFixedsys';
				src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
				font-weight: normal;
				font-display: swap;
			}

		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
